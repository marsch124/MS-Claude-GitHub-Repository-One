<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8722c">
  <meta name="description" content="Log your home fermentation batches and learn what makes the best result.">
  <title>FermentLog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FermentLog">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash of the wrong colours.
    try { var t = localStorage.getItem('fermentlog-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <main id="app"><!-- screens render here --></main>

  <nav class="tabbar">
    <a href="#/" aria-label="Batches"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 4h8"/>
        <path d="M8 4v1.4a3 3 0 0 1-.9 2.1A4 4 0 0 0 6 10.4V18a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-7.6a4 4 0 0 0-1.1-2.9A3 3 0 0 1 16 5.4V4"/>
        <path d="M6.4 12h11.2"/>
      </svg></span><span>Batches</span></a>
    <a href="#/recipes" aria-label="Recipes"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 4.5h8.5a3 3 0 0 1 3 3V20H9a3 3 0 0 1-3-3Z"/>
        <path d="M9.5 9h5M9.5 12.5h5"/>
      </svg></span><span>Recipes</span></a>
    <a href="#/new" class="fab-tab" aria-label="New batch"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
    </span><span>New</span></a>
    <a href="#/insights" aria-label="Insights"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 20h14"/><path d="M7.5 20v-4.5"/><path d="M12 20V8"/><path d="M16.5 20v-7"/>
      </svg></span><span>Insights</span></a>
    <a href="#/settings" aria-label="Settings"><span class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/>
      </svg></span><span>Settings</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
